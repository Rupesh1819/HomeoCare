services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: homeocare
      POSTGRES_PASSWORD: homeocare
      POSTGRES_DB: homeocare
    ports:
      - "5432:5432"
    volumes:
      - homeocare_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeocare -d homeocare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  homeocare_postgres:
